# =============================================================================
# MA TRẬN PHÂN LOẠI TÀI LIỆU  (nhóm hồ sơ -> loại tài liệu -> agent sử dụng)
# =============================================================================
# Nguồn: docs/document_matrix.xlsx — bản nghiệp vụ, KHÔNG nằm trong repo
# (xem .gitignore). File này là bản chép tay của workbook đó; sửa workbook thì
# phải cập nhật lại đây bằng tay.
#
# ĐÂY LÀ NGUỒN SỰ THẬT cho việc định tuyến tài liệu. Sửa file này là đổi được
# tài liệu nào đi tới agent nào — không cần đụng vào code Python.
#
# --- Cách đọc một `type` -----------------------------------------------------
#   id        : khoá kỹ thuật, không đổi (đã ghi vào log/monitoring).
#   label     : nguyên văn dòng chứng từ trong file Excel gốc.
#   keywords  : từ khoá nhận diện loại tài liệu này từ TÊN FILE và NỘI DUNG.
#               Viết không dấu, chữ thường. Hệ thống tự bỏ dấu + hạ chữ thường
#               cả từ khoá lẫn văn bản trước khi so, nên viết có dấu vẫn chạy;
#               để không dấu cho thống nhất và thấy rõ dạng đem đi so khớp.
#               Trùng tên file được tính điểm nặng gấp 3 lần trùng nội dung.
#   agents    : agent nào dùng loại tài liệu này, kèm mức R/O.
#                 R = Required — bằng chứng cốt lõi, được ưu tiên ngân sách.
#                 O = Optional — có thì dùng, xếp sau R.
#               Giá trị dạng scalar (`R`) = giống nhau ở cả 4 chương trình vay.
#               Giá trị dạng map = tách theo chương trình, PHẢI ghi đủ cả 4.
#   requirement : cột "Cấp mới"/"Tái cấp" của file gốc. Hiện CHƯA đấu vào logic,
#               giữ lại để sau này dựng checklist hồ sơ còn thiếu.
#   bctc_extraction : true = kích hoạt bước trích xuất BCTC ra JSON có cấu trúc
#               (src/agents/bctc_extraction.py).
#   proposal_extraction : true = trích Giấy đề nghị cấp tín dụng (mục B, C, D)
#               (src/agents/proposal_extraction.py).
#   cic_s10a_extraction : true = trích Báo cáo chi tiết quan hệ tín dụng CIC mã
#               S10A (src/agents/cic_s10a_extraction.py). Đặt tên theo mã phiếu
#               vì CIC phát hành nhiều loại báo cáo khác hẳn nhau về cấu trúc:
#               S10A là quan hệ tín dụng, R20/R21 là bảo đảm tiền vay.
#               MỖI cờ tốn thêm 1 lượt gọi LLM cho mỗi tài liệu khớp.
#
# --- Chọn agent chính --------------------------------------------------------
# `primary_agent` khai ở cấp nhóm, áp cho mọi loại trong nhóm. Nếu agent đó
# không có mặt trong `agents` của loại (vd I.1 chỉ có RA) thì lấy agent mức R
# đầu tiên theo thứ tự CP > CR > FS > BA > RA. Có thể override ở cấp loại.
#
# Nhóm VI không tồn tại trong file gốc (đánh số nhảy V -> VII). Giữ nguyên.
# =============================================================================

version: 1

# 4 chương trình vay. File Excel gộp B1CP/MISA/PL++ vào một cột vì hiện đang
# giống nhau; ở đây tách hẳn để khi nào lệch nhau chỉ cần sửa giá trị.
#
# `aliases` = cách người dùng có thể gọi chương trình đó trong câu hỏi. Hệ thống
# dò các cụm này trong prompt để biết dùng cột nào (xem detect_loan_program).
# Alias được chuẩn hoá y như từ khoá tài liệu: bỏ dấu, hạ chữ thường, mọi ký tự
# không phải chữ/số thành khoảng trắng — nên "PL++" và "PL+" đều thành "pl".
# So khớp theo trọn token, vì vậy "P/L" (thành "p l") KHÔNG bị nhận nhầm.
# Một alias chỉ được trỏ tới một chương trình; trùng là lỗi ngay lúc load.
loan_programs:
  - id: B1CP
    label: "B1CP"
    aliases: ["b1cp", "b1 cp"]
  - id: MISA
    label: "MISA"
    aliases: ["misa"]
  - id: PLPP
    label: "PL++"
    aliases: ["pl++", "pl+", "plpp", "pl cong cong"]
  - id: PLO
    label: "PLO"
    aliases: ["plo"]

