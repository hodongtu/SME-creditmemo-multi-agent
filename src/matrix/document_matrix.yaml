# =============================================================================
# DOCUMENT CLASSIFICATION MATRIX  (dossier group -> document type -> agents)
# =============================================================================
# Source: docs/document_matrix.xlsx — the business copy, NOT in the repo (see
# .gitignore). This file is a hand transcription of that workbook; editing the
# workbook means updating this by hand.
#
# THIS IS THE SOURCE OF TRUTH for document routing. Editing this file changes
# which document reaches which agent — no Python change required.
#
# --- How to read a `type` ----------------------------------------------------
#   id        : technical key, never changed (it is written into logs/monitoring).
#   label     : the document line verbatim from the source Excel file.
#   keywords  : terms that identify this type from the FILENAME and the CONTENT.
#               Written unaccented and lowercase. The system strips accents and
#               lowercases both keywords and text before comparing, so accented
#               spellings work too; unaccented is the convention here so the form
#               actually being compared is visible.
#               A filename hit scores 3x a content hit.
#   agents    : which agents use this type, with an R/O level.
#                 R = Required — core evidence, gets budget priority.
#                 O = Optional — used when present, ranked after R.
#               A scalar value (`R`) = identical across all 4 loan programs.
#               A map value = per-program, and MUST list all 4.
#   requirement : the "Cấp mới"/"Tái cấp" columns of the source file. NOT wired
#               into any logic yet; kept for a future missing-document checklist.
#   bctc_extraction : true = run the financial-statement pass that turns the
#               document into structured JSON (src/agents/bctc_extraction.py).
#   proposal_extraction : true = extract the credit application, sections B, C
#               and D (src/agents/proposal_extraction.py).
#   cic_s10a_extraction : true = extract the CIC credit-relationship report,
#               form S10A (src/agents/cic_s10a_extraction.py). Named after the
#               form code because CIC issues several reports whose structures
#               have nothing in common: S10A is credit relationships, R20/R21 is
#               loan collateral.
#   cic_r21_extraction : true = extract the CIC loan-collateral report
#               (src/agents/cic_r21_extraction.py). The printed form code is
#               "R20"; the flag keeps "r21" because that is the name the module
#               was registered under — only this YAML and the Python module need
#               to agree, and neither has to match what the report prints.
#               EACH flag costs one extra LLM call per matching document.
#
# --- Choosing the primary agent ----------------------------------------------
# `primary_agent` is declared at group level and applies to every type in the
# group. When that agent is absent from a type's `agents` (e.g. I.1 lists only
# RA), the first R-level agent wins, in the order CP > CR > FS > BA > RA. It can
# be overridden per type.
#
# Group VI does not exist in the source file (numbering jumps V -> VII). Kept.
# =============================================================================

version: 1

# The 4 loan programs. The Excel file merges B1CP/MISA/PL++ into one column
# because they agree today; they are separate here so that the day they diverge
# is a value edit rather than a restructure.
#
# `aliases` = how a user might name the program in a question. The system looks
# for these phrases in the prompt to pick the right column (see
# detect_loan_program). Aliases are normalised exactly like document keywords:
# accents stripped, lowercased, every non-alphanumeric character turned into a
# space — so "PL++" and "PL+" both become "pl". Matching is whole-token, which
# is why "P/L" (becoming "p l") is NOT mistaken for it.
# An alias may point at only one program; a duplicate is an error at load time.
loan_programs:
  - id: B1CP
    label: "B1CP"
    aliases: ["b1cp", "b1 cp"]
  - id: MISA
    label: "MISA"
    aliases: ["misa"]
  - id: PLPP
    label: "PL++"
    aliases: ["pl++", "pl+", "plpp", "pl cong cong"]
  - id: PLO
    label: "PLO"
    aliases: ["plo"]

