          # TIỀN VAY" is itself often misread, because it is large and bold, so
          # the two phrases below anchor on section 2 instead — "THÔNG TIN ĐẢM
          # BẢO TIỀN VAY CỦA KHÁCH HÀNG TẠI CÁC TỔ CHỨC TÍN DỤNG" and the label
          # repeated above every asset block, "Danh sách Tài sản bảo đảm:".
          # Both are long enough not to collide by chance with S10A or with
          # ho_so_tsbd (the original ownership papers, not a CIC report).
          - "dam bao tien vay cua khach hang"
          - "danh sach tai san bao dam"
          - "chi tiet ve bao dam tien vay"
          - "ma so tai san"
          - "ngay bao cao tai san gan nhat"
          - "ngay the chap"
          - "ngay giai chap"

